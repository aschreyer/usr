[metadata]
name = rd-usr
description =
    Python implementation of the Ultrafast Shape Recognition (USR) algorithm.
long-description = file: README.md
url = https://github.com/aschreyer/usr
author = Adrian Schreyer
project_urls =
    Source code = https://github.com/aschreyer/usr
    Issue tracker = https://github.com/aschreyer/usr/issues
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Programming Language :: Python
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Typing :: Typed
    License :: OSI Approved :: MIT License

[options]
packages = find:
python_requires = >= 3.7
include_package_data = True
setup_requires =
    setuptools_scm>=3.2
install_requires =
    pydantic
    typer
    loguru
    numpy
    scipy

[options.extras_require]
tests =
    pytest>=4
    pytest-cov>=2.6
    pytest-flake8>=1.0
    pytest-ordering>=0.6
    coverage-badge>=1.0.1
docs =
    sphinx
    sphinx-rtd-theme

[options.entry_points]
console_scripts =
    usr = usr.cli:app

[tool:pytest]
addopts =
    -rx --doctest-modules --flake8 --cov=usr --ignore setup.py
    -p no:cacheprovider -p no:warnings
flake8-max-line-length = 88
flake8-ignore =
    # do not check Sphinx
    docs/*.py ALL
    # module imported but unused
    __init__.py F401

[coverage:run]
source = usr
