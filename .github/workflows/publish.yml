name: Publish

# A `v*` tag is the version: hatch-vcs builds `v1.2.0` as 1.2.0.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository] -- the form every runner accepts
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, so hatch-vcs can read the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: a restored cache entry could reach the published artefact.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false

      - name: Build the sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # PyPI trusted publishing: PyPI must list this repository, this workflow and
  # the `pypi` environment as a trusted publisher. No token is stored.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rd-usr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
